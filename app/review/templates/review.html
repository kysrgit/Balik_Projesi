<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tespit İnceleme</title>
<style>
  :root {
    --bg: #0f1419; --panel: #182029; --line: #2a3542; --text: #e6edf3; --muted: #8b98a5;
    --gt: #ffffff; --tp: #3fb950; --fp: #f85149; --fn: #f0a030; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  label { color: var(--muted); font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
  select, button, input[type=file] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  button { cursor: pointer; } button.primary { background: var(--accent); color: #04121f; border-color: var(--accent); font-weight: 600; }
  .check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
  input[type=range] { width: 180px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 92px; }
  .stat b { display: block; font-size: 17px; } .stat span { color: var(--muted); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .sw { display: inline-block; width: 14px; height: 10px; margin-right: 5px; border: 2px solid; vertical-align: -1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
  .filters button.on { border-color: var(--accent); color: var(--accent); }
  main { padding: 12px 16px 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .frame { position: relative; line-height: 0; }
  .frame img { width: 100%; display: block; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .meta { padding: 6px 8px; font-size: 12px; display: flex; justify-content: space-between; gap: 6px; }
  .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-weight: 600; white-space: nowrap; }
  .ok { color: var(--tp); } .bad { color: var(--fp); } .miss { color: var(--fn); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; z-index: 10; align-items: center; justify-content: center; flex-direction: column; padding: 16px; }
  #viewer.open { display: flex; }
  #viewer .frame { max-width: min(1100px, 100%); }
  #viewer .frame img { max-height: 78vh; width: auto; max-width: 100%; margin: auto; }
  #vinfo { margin-top: 10px; text-align: center; color: var(--text); }
  #vinfo small { color: var(--muted); display: block; }
  .nav { position: fixed; top: 50%; background: none; border: none; color: #fff; font-size: 40px; padding: 10px; }
  #prev { left: 6px; } #next { right: 6px; } #close { position: fixed; top: 10px; right: 14px; font-size: 26px; background: none; border: none; color: #fff; }
  #busy { display: none; color: var(--accent); margin-left: 6px; } #busy.on { display: inline; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } input[type=range] { width: 120px; } }
</style>
</head>
<body>
<header>
  <h1>🐡 Balon Balığı Tespit İnceleme</h1>
  <div class="controls">
    <label>Model
      <select id="model">{% for m in models %}<option value="{{m}}" {% if m == default_model %}selected{% endif %}>{{m}}</option>{% endfor %}</select>
    </label>
    <label class="check" title="Ölçümlerde CLAHE doğruluğu düşürdü; uygulamada varsayılan kapalı"><input type="checkbox" id="clahe"> CLAHE uygula</label>
    <label>Veri seti
      <select id="split">{% for s in splits %}<option value="{{s}}">{{s}}</option>{% endfor %}</select>
    </label>
    <button class="primary" id="run">Çalıştır</button>
    <label>Kendi görüntü / videon
      <input type="file" id="files" multiple accept="image/*,video/*">
    </label>
    <span id="busy">⏳ çalışıyor…</span>
  </div>
  <div class="controls" style="margin-top:10px">
    <label>Güven eşiği: <b id="confv">0.60</b>
      <input type="range" id="conf" min="0.05" max="0.95" step="0.05" value="0.60">
    </label>
    <label class="check"><input type="checkbox" id="showgt" checked> Etiketleri göster</label>
  </div>
  <div class="stats" id="stats"></div>
  <div class="legend">
    <span><i class="sw" style="border-color:var(--tp)"></i>Doğru tespit</span>
    <span><i class="sw" style="border-color:var(--fp)"></i>Yanlış alarm</span>
    <span><i class="sw" style="border-color:var(--fn);border-style:dashed"></i>Kaçırılan balık</span>
    <span><i class="sw" style="border-color:var(--gt);border-style:dotted"></i>Etiket (gerçek konum)</span>
  </div>
</header>
<div class="filters" id="filters"></div>
<main><div class="grid" id="grid"></div><div class="empty" id="empty">Bir model seçip <b>Çalıştır</b>'a bas ya da kendi dosyanı yükle.</div></main>

<div id="viewer">
  <button id="close" aria-label="Kapat">✕</button>
  <button class="nav" id="prev" aria-label="Önceki">‹</button>
  <div class="frame" id="vframe"></div>
  <div id="vinfo"></div>
  <button class="nav" id="next" aria-label="Sonraki">›</button>
</div>

<script src="/static/editor.js"></script>
<script>
const $ = id => document.getElementById(id);
let data = null, view = [], filter = "all", cur = -1;

function iou(a, b) {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[2], b[2]), y2 = Math.min(a[3], b[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const u = (a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter;
  return u > 0 ? inter / u : 0;
}

// Esige gore tahminleri etiketlerle esle (IoU >= 0.5, guvene gore aç gozlu)
function evaluate(item, thr) {
  const preds = item.pred.filter(p => p[4] >= thr).sort((a, b) => b[4] - a[4]);
  if (item.gt === null) return { preds: preds.map(p => ({ box: p, kind: "pred" })), miss: [], tp: 0, fp: 0, fn: 0 };
  const used = new Set(), out = [];
  for (const p of preds) {
    let best = -1, bi = 0.5;
    item.gt.forEach((g, i) => { if (!used.has(i)) { const v = iou(p, g); if (v >= bi) { bi = v; best = i; } } });
    if (best >= 0) { used.add(best); out.push({ box: p, kind: "tp" }); } else out.push({ box: p, kind: "fp" });
  }
  const miss = item.gt.filter((_, i) => !used.has(i));
  const tp = out.filter(o => o.kind === "tp").length;
  return { preds: out, miss, tp, fp: out.length - tp, fn: miss.length };
}

function status(item, ev) {
  if (item.gt === null) return ev.preds.length ? ["bad", `${ev.preds.length} balık`] : ["", "balık yok"];
  if (item.gt.length === 0) return ev.fp ? ["bad", "boş sahnede alarm"] : ["ok", "boş sahne ✓"];
  if (ev.fp && ev.fn) return ["bad", `${ev.fn} kaçırıldı, ${ev.fp} yanlış`];
  if (ev.fn) return ["miss", `${ev.fn}/${item.gt.length} kaçırıldı`];
  if (ev.fp) return ["bad", `${ev.fp} yanlış alarm`];
  return ["ok", `${ev.tp}/${item.gt.length} ✓`];
}

function svg(item, ev, big) {
  const sw = big ? 0.004 : 0.008, col = { tp: "var(--tp)", fp: "var(--fp)", pred: "var(--fp)" };
  const r = (b, c, dash) => `<rect x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}" fill="none" stroke="${c}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ""} vector-effect="non-scaling-stroke" style="stroke-width:${big ? 3 : 2}px"/>`;
  const t = (b, c, s) => `<text x="${b[0]+0.005}" y="${Math.max(b[1]-0.01, 0.035)}" fill="${c}" font-size="${big ? 0.028 : 0.05}" font-weight="700" style="paint-order:stroke;stroke:#000;stroke-width:0.006">${s}</text>`;
  let s = "";
  if ($("showgt").checked && item.gt) for (const g of item.gt) s += r(g, "var(--gt)", "0.01 0.008");
  for (const m of ev.miss) s += r(m, "var(--fn)", "0.02 0.012");
  for (const p of ev.preds) s += r(p.box, col[p.kind]) + t(p.box, col[p.kind], (p.box[4] * 100).toFixed(0) + "%");
  return `<svg viewBox="0 0 1 1" preserveAspectRatio="none">${s}</svg>`;
}

function render() {
  if (!data) return;
  const thr = +$("conf").value;
  let tp = 0, fp = 0, fn = 0, negAlarm = 0, neg = 0, perfect = 0;
  const evs = data.items.map(it => {
    const ev = evaluate(it, thr);
    tp += ev.tp; fp += ev.fp; fn += ev.fn;
    if (it.gt && it.gt.length === 0) { neg++; if (ev.fp) negAlarm++; }
    if (it.gt && !ev.fp && !ev.fn) perfect++;
    return ev;
  });
  const P = tp + fp ? tp / (tp + fp) : 0, R = tp + fn ? tp / (tp + fn) : 0, F = P + R ? 2 * P * R / (P + R) : 0;
  const st = data.labeled ? [
    [(P*100).toFixed(1) + "%", "Kesinlik (precision)"], [(R*100).toFixed(1) + "%", "Duyarlılık (recall)"],
    [(F*100).toFixed(1) + "%", "F1"], [`${tp}`, "Doğru tespit"], [`${fp}`, "Yanlış alarm"], [`${fn}`, "Kaçırılan"],
    [`${negAlarm}/${neg}`, "Boş sahnede alarm"], [`${perfect}/${data.items.length}`, "Kusursuz görüntü"],
    [data.ms_per_image + " ms", "Görüntü başı (PC)"]
  ] : [[`${data.items.length}`, "Kare"], [`${evs.filter(e => e.preds.length).length}`, "Balık bulunan kare"], [data.ms_per_image + " ms", "Görüntü başı (PC)"]];
  $("stats").innerHTML = st.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  const fdefs = data.labeled ? [["all", "Tümü"], ["errors", "Hatalı olanlar"], ["miss", "Kaçırılan var"], ["fp", "Yanlış alarm var"], ["neg", "Boş sahneler"], ["ok", "Kusursuz"]]
                             : [["all", "Tümü"], ["found", "Balık bulunan"], ["none", "Balık bulunmayan"]];
  if (!fdefs.some(f => f[0] === filter)) filter = "all";
  $("filters").innerHTML = fdefs.map(([k, l]) => `<button data-f="${k}" class="${k === filter ? "on" : ""}">${l}</button>`).join("");
  const keep = (it, ev) => ({ all: true, errors: ev.fp + ev.fn > 0, miss: ev.fn > 0, fp: ev.fp > 0,
    neg: it.gt && it.gt.length === 0, ok: it.gt && !ev.fp && !ev.fn, found: ev.preds.length > 0, none: ev.preds.length === 0 })[filter];
  view = data.items.map((it, i) => [it, evs[i]]).filter(([it, ev]) => keep(it, ev));
  $("grid").innerHTML = view.map(([it, ev], i) => {
    const [cls, txt] = status(it, ev);
    return `<div class="card" data-i="${i}"><div class="frame"><img loading="lazy" src="${it.src}" alt="">${svg(it, ev, false)}</div>
      <div class="meta"><span class="name" title="${it.name}">${it.name}</span><span class="badge ${cls}">${txt}</span></div></div>`;
  }).join("");
  $("empty").style.display = view.length ? "none" : "block";
  $("empty").textContent = "Bu filtrede görüntü yok.";
  if (cur >= 0) show(Math.min(cur, view.length - 1));
}

function show(i) {
  if (i < 0 || i >= view.length) return close();
  cur = i;
  const [it, ev] = view[i], [cls, txt] = status(it, ev);
  $("vframe").innerHTML = `<img src="${it.src}" alt="">${svg(it, ev, true)}`;
  const confs = ev.preds.map(p => (p.box[4] * 100).toFixed(0) + "%").join(", ") || "—";
  const fixBtn = it.path ? ` · <button id="fixbtn" style="background:#58a6ff;color:#04121f;border:0;border-radius:6px;padding:4px 10px;font-weight:600;cursor:pointer">✎ Hata bildir / etiketi düzelt (H)</button>` : "";
  const fixed = it.fix ? ` · <b style="color:var(--fn)">✎ düzeltildi${it.fix.note ? ": " + it.fix.note.slice(0, 60) : ""}</b>` : "";
  $("vinfo").innerHTML = `<span class="badge ${cls}">${txt}</span> · ${it.name}${fixed}${fixBtn}<small>${i + 1} / ${view.length} · tahmin güvenleri: ${confs} · ← → ile gez, Esc ile kapat</small>`;
  if (it.path) $("fixbtn").onclick = () => openFix(it);
  $("viewer").classList.add("open");
}
function close() { cur = -1; $("viewer").classList.remove("open"); }
function openFix(it) {
  openFixEditor({ path: it.path, src: it.src, gt: it.gt || [], preds: it.pred, thr: +$("conf").value,
    onSaved: async fx => {  // etiketler degisti: metrikleri sunucudaki guncel etiketlerle yeniden hesapla
      const keep = cur, f = filter; await call(fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...opts(), split: $("split").value }) }));
      filter = f; render(); if (keep >= 0 && view.length) show(Math.min(keep, view.length - 1));
    } });
}

function opts() { return { model: $("model").value, clahe: $("clahe").checked }; }
async function call(promise) {
  $("busy").classList.add("on"); $("run").disabled = true;
  try { const r = await promise; if (!r.ok) throw new Error(await r.text()); data = await r.json(); filter = "all"; render(); }
  catch (e) { alert("Hata: " + e.message); }
  finally { $("busy").classList.remove("on"); $("run").disabled = false; }
}
$("run").onclick = () => call(fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...opts(), split: $("split").value }) }));
$("files").onchange = () => {
  const fd = new FormData(), o = opts();
  for (const f of $("files").files) fd.append("files", f);
  Object.entries(o).forEach(([k, v]) => fd.append(k, v));
  call(fetch("/api/upload", { method: "POST", body: fd }));
  $("files").value = "";
};
$("conf").oninput = () => { $("confv").textContent = (+$("conf").value).toFixed(2); render(); };
$("showgt").onchange = render;
$("filters").onclick = e => { const f = e.target.dataset.f; if (f) { filter = f; render(); } };
$("grid").onclick = e => { const c = e.target.closest(".card"); if (c) show(+c.dataset.i); };
$("close").onclick = close; $("prev").onclick = () => show(cur - 1); $("next").onclick = () => show(cur + 1);
$("viewer").onclick = e => { if (e.target.id === "viewer") close(); };
document.onkeydown = e => {
  if (window.fixEditorOpen && fixEditorOpen()) return;
  if (cur < 0) return;
  if ((e.key === "h" || e.key === "H") && view[cur][0].path) { openFix(view[cur][0]); e.preventDefault(); return; }
  if (e.key === "ArrowLeft") show(cur - 1); else if (e.key === "ArrowRight") show(cur + 1); else if (e.key === "Escape") close();
};
</script>
</body>
</html>
