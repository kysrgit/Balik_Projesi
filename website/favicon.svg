<!-- Balon Balığı Tespit Sistemi — Derin deniz sonar halkası ve stilize balık silueti vektör favicon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Balon Balığı Tespit Sistemi">
  <defs>
    <radialGradient id="abyssBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0d2542"/>
      <stop offset="100%" stop-color="#061120"/>
    </radialGradient>
    <linearGradient id="bioTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5c3"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sonarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5c3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Derin deniz yuvarlatılmış zemin -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#abyssBg)" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Dış ve iç sonar halkaları -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1.5"/>
  <path d="M 32 9 A 23 23 0 0 1 55 32" fill="none" stroke="url(#sonarSweep)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#00e5c3" stroke-opacity="0.32" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- Stilize balon balığı silueti (sağa dönük) -->
  <path d="M 21 32 L 13 24.5 C 14.8 29.2 14.8 34.8 13 39.5 Z" fill="url(#bioTeal)" opacity="0.92"/>
  <path d="M 19.5 32 C 21.5 23 30 19.5 39 20.5 C 45.8 21.3 50.8 26.2 52 32 C 50.8 37.8 45.8 42.7 39 43.5 C 30 44.5 21.5 41 19.5 32 Z" fill="url(#bioTeal)"/>
  <!-- Sırt ve karın yüzgeci vurgusu -->
  <path d="M 29 21 C 31.5 17.8 35.5 17.5 37.5 20.2" fill="none" stroke="#00e5c3" stroke-width="2" stroke-linecap="round"/>

  <!-- Göz ve biyolüminesan parlama -->
  <circle cx="43.5" cy="29.5" r="2.8" fill="#061120"/>
  <circle cx="44.3" cy="28.7" r="1" fill="#e6fffa"/>

  <!-- Sonar hedef ping noktası -->
  <circle cx="51" cy="14" r="2.2" fill="#00e5c3"/>
</svg>
